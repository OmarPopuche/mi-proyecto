<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastFoot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

<!-- =============================================
     NAVBAR
============================================= -->
<nav class="navbar">
  <div class="contenedor">

    <a href="/" class="logo-container">
      <img class="logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo FastFoot">
      <span>FastFoot</span>
    </a>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="menu" id="menu">

      {% if usuario %}
        <span class="saludo-usuario">Hola, {{ usuario.nombres }}</span>

        {% if usuario.codigo == "001" %}
          <a href="/dashboard" class="btn-dashboard">⚙️ Dashboard</a>
        {% endif %}
      {% endif %}

      <a href="#" onclick="toggleLogin()" aria-label="Mi cuenta">
        <img class="icono" src="{{ url_for('static', filename='img/usuario.webp') }}" alt="Usuario">
      </a>

      <a href="#" onclick="toggleCarrito()" aria-label="Carrito" style="position:relative;">
        <img class="icono" src="{{ url_for('static', filename='img/carrito.png') }}" alt="Carrito">
        <span id="carrito-badge" class="badge" style="display:none;">0</span>
      </a>

    </div>
  </div>
</nav>

<!-- =============================================
     PANEL LOGIN
============================================= -->
<div id="panel-login" class="panel-login" role="dialog" aria-label="Panel de usuario">

  <div class="panel-header">
    <h3>Mi Cuenta</h3>
    <span onclick="toggleLogin()" class="cerrar" aria-label="Cerrar">✖</span>
  </div>

  <div id="login-mensaje" class="mensaje-panel" style="display:none;"></div>

  <div id="vista-inicial" class="vista-panel">
    <button onclick="mostrarVista('login')">🔑 Iniciar Sesión</button>
    <button onclick="mostrarVista('registro')">📝 Registrarse</button>
    <button onclick="modoInvitado()">👤 Continuar como invitado</button>
  </div>

  <div id="vista-login" class="vista-panel" style="display:none;">
    <label for="login-codigo">Código de usuario</label>
    <input type="text" id="login-codigo" placeholder="Ej: 001" maxlength="4" inputmode="numeric">
    <button onclick="login()">Ingresar</button>
    <button onclick="volver()" class="btn-secundario">← Volver</button>
  </div>

  <div id="vista-registro" class="vista-panel" style="display:none;">
    <label for="reg-codigo">Código (máx 4 dígitos)</label>
    <input type="text" id="reg-codigo" placeholder="Ej: 003" maxlength="4" inputmode="numeric">
    <label for="reg-nombre">Nombres</label>
    <input type="text" id="reg-nombre" placeholder="Tu nombre">
    <label for="reg-apellido">Apellidos</label>
    <input type="text" id="reg-apellido" placeholder="Tu apellido">
    <button onclick="registrar()">Registrarse</button>
    <button onclick="volver()" class="btn-secundario">← Volver</button>
  </div>

  <div id="vista-usuario" class="vista-panel" style="display:none;">
    <h4 id="usuario-nombre"></h4>
    <p id="usuario-codigo-display" style="color:#888; font-size:13px;"></p>
    <label for="edit-nombres">Nombres</label>
    <input type="text" id="edit-nombres" placeholder="Nombres">
    <label for="edit-apellidos">Apellidos</label>
    <input type="text" id="edit-apellidos" placeholder="Apellidos">
    <button onclick="modificarUsuario()">💾 Guardar cambios</button>
    <button onclick="logout()" class="btn-peligro">🚪 Cerrar sesión</button>
  </div>

</div>

<!-- =============================================
     MAIN
============================================= -->
<main>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-content">
      <h1>FastFoot</h1>
      <p>Comida rápida, deliciosa y al mejor precio</p>
      <button class="btn-primary"
              onclick="document.querySelector('.productos').scrollIntoView({behavior:'smooth'})">
        Ver menú
      </button>
    </div>
  </section>

  <!-- =============================================
       MENÚ DINÁMICO
       ✅ El contenedor #grid-productos está vacío.
       script.js lo llena con fetch a /api/productos.
       No hay cards hardcodeadas — todo viene del txt.
  ============================================= -->
  <section class="productos">
    <h2>🔥 Nuestro Menú</h2>
    <div class="grid" id="grid-productos">
      <!--
        Texto de carga visible mientras JS hace el fetch.
        MenuDinamico.init() lo reemplaza con las cards reales.
      -->
      <p class="cargando-menu">Cargando menú...</p>
    </div>
  </section>

  <!-- CARRITO — slide desde la derecha -->
  <div id="carrito" class="carrito" role="dialog" aria-label="Carrito de compras">

    <div class="carrito-header">
      <h3>🛒 Carrito</h3>
      <span class="cerrar" onclick="toggleCarrito()">✖</span>
    </div>

    <div id="carrito-items" class="carrito-items"></div>

    <div class="carrito-footer">
      <p>Total: <strong>S/ <span id="total">0</span></strong></p>
      <button class="btn-confirmar" onclick="confirmarPedido()">
        ✅ Confirmar Pedido
      </button>
    </div>

  </div>

</main>

<!--
  Datos de sesión inyectados por Flask para que JS
  los lea sin variables globales hardcodeadas.
  Visible solo cuando hay sesión activa.
-->
{% if usuario %}
<div id="session-data"
     data-codigo="{{ usuario.codigo }}"
     data-nombres="{{ usuario.nombres }}"
     data-apellidos="{{ usuario.apellidos }}"
     style="display:none;">
</div>
{% endif %}

<!--
  ✅ script.js al final del body.
  Contiene: Auth, UI, Carrito, MenuDinamico.
  Un solo archivo, sin dependencias externas.
-->
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
